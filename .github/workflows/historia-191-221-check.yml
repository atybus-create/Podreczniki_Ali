name: Temp Historia 191-221 check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historia-191-221-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-historia-191-221
      - name: Check existing JSONs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/historia-191-221
          curl -fsS --retry 5 "https://podrecznikiali.vercel.app/api/import-historia-temp?mode=check" > qa/historia-191-221/check.json
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/historia-191-221/check.json
          git commit -m "Temporary existing-text check Historia 191-221"
          git push origin HEAD:qa-historia-191-221
