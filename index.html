<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#17324d" />
<title>Podręczniki Ali — Geografia 5</title>
<style>
:root{--nav:#17324d;--ink:#18324a;--muted:#66788a;--bg:#eef3f7;--paper:#fff;--accent:#2a78d1;--read:#fff0a8;--word:#ffd451;--rule:#e9f6e9;--line:#d8e1e8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Verdana,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,select{font:inherit}.top{position:sticky;top:0;z-index:10;background:var(--nav);color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 2px 10px #0002}.brand{font-weight:800}.book{font-size:.9rem;opacity:.9}.layout{max-width:1450px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(330px,47%) 1fr;gap:14px;min-height:calc(100vh - 72px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #16324a12}.pageCard{padding:12px;display:flex;flex-direction:column;min-height:70vh}.pageHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.pill{background:#e9f1f8;padding:7px 10px;border-radius:999px;font-size:.9rem}.pageVisual{flex:1;min-height:420px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#f7fbff;display:flex;align-items:stretch}.pageVisual svg{width:100%;height:100%;min-height:420px;display:block}.sourceFrame{width:100%;height:100%;min-height:720px;border:0;background:#fff}.sourceFallback{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:8px}.sourceFallback a{color:#1f66a8;font-weight:700;text-decoration:none}
.reader{padding:16px;display:flex;flex-direction:column;min-height:70vh}.reader h1{font-size:1.35rem;margin:0 0 5px}.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}.text{font-size:1.22rem;line-height:1.72;letter-spacing:.01em;overflow:auto;max-height:52vh;padding-right:5px}.block{margin:0 0 14px;padding:10px 12px;border-radius:12px}.block.definition{background:var(--rule);border-left:5px solid #4c9f55}.block.caption{font-size:1rem;color:#506474;background:#f4f7fa}.sentence{border-radius:7px;padding:2px 3px;cursor:pointer;transition:.12s}.sentence:hover{background:#edf5ff}.sentence.active{background:var(--read);box-shadow:0 0 0 2px #efd56c inset}.word.activeWord{background:var(--word);border-radius:4px;padding:0 1px}
.controls{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.btn{border:1px solid #bfd0df;background:#fff;border-radius:12px;padding:10px 13px;min-height:44px;cursor:pointer;font-weight:700;color:var(--ink)}.btn:hover{background:#f0f6fb}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.warn{background:#fff8dc}.btn:active{transform:translateY(1px)}.grow{flex:1}.speed{border:1px solid #bfd0df;border-radius:10px;padding:9px;background:white}.status{color:var(--muted);font-size:.9rem}.navBtns{display:flex;gap:8px}.dyslexic .text{font-size:1.32rem;line-height:1.9;letter-spacing:.06em;word-spacing:.12em}.dyslexic .sentence{padding:3px 4px}.footerNote{font-size:.8rem;color:var(--muted);padding:8px 2px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:8px}.pageCard,.reader{min-height:auto}.pageVisual{min-height:520px}.pageVisual svg{min-height:330px}.sourceFrame{min-height:520px}.text{max-height:none}.top{align-items:flex-start}.book{font-size:.78rem}.reader{padding:13px}.text{font-size:1.13rem}.controls{position:sticky;bottom:0;background:#fff;padding:10px 0 4px}.btn{padding:10px 11px}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">📚 Podręczniki Ali</div><div class="book">Geografia — Planeta Nowa 5 · wersja testowa</div></div><button id="dysBtn" class="btn">Aa tryb dysleksji</button></header>
<main class="layout" id="app">
<section class="card pageCard"><div class="pageHead"><div><strong id="pageTitle">Strona 1</strong><div class="status" id="sectionTitle"></div></div><div class="navBtns"><button class="btn" id="prevPage">←</button><span class="pill" id="pageCounter">1 / 5</span><button class="btn" id="nextPage">→</button></div></div><div id="pageVisual" class="pageVisual"></div><div class="sourceFallback"><span class="footerNote">Widok źródłowej strony podręcznika Nowej Ery.</span><a id="sourceLink" target="_blank" rel="noopener">Otwórz oryginał ↗</a></div></section>
<section class="card reader"><h1 id="readerTitle">Czytanie strony</h1><div class="sub">Kliknij dowolne zdanie, aby zacząć czytać od tego miejsca.</div><div class="text" id="text"></div><div class="controls"><div class="row"><button class="btn" id="prevSentence">◀ zdanie</button><button class="btn warn" id="back10">−10 s</button><button class="btn primary" id="play">▶ Czytaj</button><button class="btn" id="pause">⏸ Pauza</button><button class="btn warn" id="fwd10">+10 s</button><button class="btn" id="nextSentence">zdanie ▶</button></div><div class="row"><button class="btn" id="repeatBlock">↻ Powtórz akapit</button><button class="btn" id="repeatDefinition">↻ Regułka</button><label>Tempo <select class="speed" id="speed"><option value="0.7">0,7×</option><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option></select></label><span class="status grow" id="status">Gotowe</span></div></div></section>
</main>
<script>
const pages=[
{title:'Czym zajmuje się geografia?',section:'Wprowadzenie',blocks:[
 {type:'paragraph',text:'Geografia pomaga poznawać Ziemię, miejsca, krajobrazy i zjawiska zachodzące w przyrodzie. Uczy również, jak człowiek korzysta ze środowiska i jak je zmienia.'},
 {type:'definition',text:'Geografia to nauka o Ziemi, jej środowisku oraz działalności człowieka w przestrzeni.'},
 {type:'caption',text:'Na ilustracji pokazano przykładowy krajobraz z rzeką, wzgórzami i zabudowaniami.'}]},
{title:'Źródła wiedzy geograficznej',section:'Wprowadzenie',blocks:[
 {type:'paragraph',text:'Informacje geograficzne zdobywamy z map, zdjęć, obserwacji terenowych, wykresów i danych liczbowych. Każde źródło pokazuje inne cechy badanego obszaru.'},
 {type:'definition',text:'Mapa przedstawia powierzchnię Ziemi lub jej fragment w pomniejszeniu i za pomocą umownych znaków.'},
 {type:'caption',text:'Przy nauce warto łączyć tekst z mapą i zdjęciem, ponieważ ułatwia to zapamiętywanie informacji.'}]},
{title:'Mapa i jej elementy',section:'Mapa Polski',blocks:[
 {type:'paragraph',text:'Mapa ma tytuł, legendę i skalę. Legenda wyjaśnia znaczenie kolorów oraz znaków użytych na mapie. Skala pozwala porównać odległość na mapie z odległością w terenie.'},
 {type:'definition',text:'Legenda to objaśnienie znaków i barw zastosowanych na mapie.'},
 {type:'caption',text:'Podczas czytania mapy najpierw sprawdź jej tytuł, a następnie legendę i skalę.'}]},
{title:'Skala mapy',section:'Mapa Polski',blocks:[
 {type:'paragraph',text:'Skala informuje, ile razy rzeczywiste odległości zostały pomniejszone na mapie. Tę samą skalę można zapisać liczbowo, mianowanie albo w formie podziałki liniowej.'},
 {type:'definition',text:'Skala mapy określa stosunek odległości na mapie do odpowiadającej jej odległości w terenie.'},
 {type:'caption',text:'Przed wykonaniem obliczeń sprawdź, w jakich jednostkach podano odległości.'}]},
{title:'Ukształtowanie powierzchni',section:'Mapa Polski',blocks:[
 {type:'paragraph',text:'Na mapach hipsometrycznych wysokość terenu oznacza się kolorami. Niziny, wyżyny i góry można rozpoznać dzięki barwom opisanym w legendzie.'},
 {type:'definition',text:'Wysokość bezwzględna to wysokość danego punktu mierzona od poziomu morza.'},
 {type:'caption',text:'Kolory na mapie hipsometrycznej nie oznaczają roślinności, tylko przedziały wysokości.'}]}
];
let pageIndex=0,sentenceIndex=0,currentWord=0,speaking=false,paused=false,currentUtter=null;
const $=id=>document.getElementById(id);
const state={sentences:[],meta:[]};
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function splitSentences(text){return (text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text]).map(s=>s.trim()).filter(Boolean)}
function visual(p,i){const hues=['#d9edf8','#e9f3dd','#f8ecd7','#e6e3f8','#dfeee7'];const accent=['#2d7fb8','#4d9554','#c98a35','#7768b2','#49826b'];return `<svg viewBox="0 0 700 900" role="img" aria-label="Demonstracyjna strona ${i+1}"><rect width="700" height="900" fill="${hues[i]}"/><rect x="55" y="55" width="590" height="790" rx="18" fill="#fff"/><text x="90" y="120" font-size="24" fill="#566b7a">GEOGRAFIA 5</text><text x="90" y="175" font-size="34" font-weight="700" fill="#18324a">${esc(p.title)}</text><rect x="90" y="215" width="520" height="250" rx="18" fill="${accent[i]}" opacity=".18"/><circle cx="220" cy="335" r="78" fill="${accent[i]}" opacity=".65"/><path d="M300 395 L380 285 L470 395 Z" fill="${accent[i]}" opacity=".78"/><path d="M120 455 C210 410 300 500 400 445 C490 395 550 455 610 430" fill="none" stroke="${accent[i]}" stroke-width="12"/><rect x="90" y="515" width="480" height="15" rx="7" fill="#cdd8df"/><rect x="90" y="550" width="520" height="15" rx="7" fill="#cdd8df"/><rect x="90" y="585" width="430" height="15" rx="7" fill="#cdd8df"/><rect x="90" y="650" width="520" height="115" rx="14" fill="${accent[i]}" opacity=".12"/><text x="115" y="705" font-size="25" font-weight="700" fill="#18324a">Regułka / definicja</text><text x="590" y="810" font-size="24" fill="#66788a">${i+1}</text></svg>`}
function buildPage(){speechSynthesis.cancel();speaking=false;paused=false;currentWord=0;const p=pages[pageIndex];$('pageTitle').textContent=`Strona ${pageIndex+1}`;$('sectionTitle').textContent=p.section;$('pageCounter').textContent=`${pageIndex+1} / ${pages.length}`;$('readerTitle').textContent=p.title;const sourcePage=pageIndex+2;const sourceUrl=`https://flipbook.nowaera.pl/dokumenty/Flipbook/Geografia-Planeta-nowa-podrecznik%5Bkl_5%5D%5Bpr_2021%5D/files/basic-html/page${sourcePage}.html`;$('pageVisual').innerHTML=`<iframe class="sourceFrame" title="Oryginalna strona podręcznika ${sourcePage}" src="${sourceUrl}" loading="eager"></iframe>`;$('sourceLink').href=sourceUrl;$('pageTitle').textContent=`Podręcznik — strona ${sourcePage}`;state.sentences=[];state.meta=[];let html='';p.blocks.forEach((b,bi)=>{html+=`<div class="block ${b.type}" data-block="${bi}">`;splitSentences(b.text).forEach((s,si)=>{const idx=state.sentences.length;state.sentences.push(s);state.meta.push({block:bi,type:b.type});const words=s.split(/(\s+)/).map((w,wi)=>/^\s+$/.test(w)?w:`<span class="word" data-w="${wi}">${esc(w)}</span>`).join('');html+=`<span class="sentence" data-i="${idx}">${words}</span> `});html+='</div>'});$('text').innerHTML=html;sentenceIndex=Math.min(sentenceIndex,state.sentences.length-1);markSentence();document.querySelectorAll('.sentence').forEach(el=>el.addEventListener('click',()=>{sentenceIndex=+el.dataset.i;currentWord=0;speakCurrent()}));updateStatus('Gotowe')}
function markSentence(){document.querySelectorAll('.sentence').forEach((e,i)=>e.classList.toggle('active',i===sentenceIndex));document.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));const el=document.querySelector(`.sentence[data-i="${sentenceIndex}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function markWord(charIndex){const sent=document.querySelector(`.sentence[data-i="${sentenceIndex}"]`);if(!sent)return;sent.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));let pos=0;for(const w of sent.querySelectorAll('.word')){const t=w.textContent;if(charIndex>=pos&&charIndex<=pos+t.length){w.classList.add('activeWord');break}pos+=t.length+1}}
function updateStatus(t){$('status').textContent=t}
function speakCurrent(){speechSynthesis.cancel();paused=false;if(sentenceIndex<0||sentenceIndex>=state.sentences.length)return;markSentence();const u=new SpeechSynthesisUtterance(state.sentences[sentenceIndex]);u.lang='pl-PL';u.rate=+$('speed').value;u.onstart=()=>{speaking=true;updateStatus(`Czytam zdanie ${sentenceIndex+1} z ${state.sentences.length}`)};u.onboundary=e=>{if(e.name==='word')markWord(e.charIndex)};u.onend=()=>{speaking=false;document.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));if(!paused&&sentenceIndex<state.sentences.length-1){sentenceIndex++;speakCurrent()}else updateStatus('Koniec strony')};u.onerror=()=>{speaking=false;updateStatus('Syntezator mowy został zatrzymany')};currentUtter=u;speechSynthesis.speak(u)}
function pauseResume(){if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();paused=true;updateStatus('Pauza')}else if(speechSynthesis.paused){speechSynthesis.resume();paused=false;updateStatus('Czytam')}}
function jumpSentence(delta,auto=true){sentenceIndex=Math.max(0,Math.min(state.sentences.length-1,sentenceIndex+delta));currentWord=0;markSentence();if(auto)speakCurrent()}
function sentenceSeconds(s){return Math.max(2,s.split(/\s+/).length/(2.6*+$('speed').value))}
function jumpTime(sec){let idx=sentenceIndex,remaining=Math.abs(sec),dir=sec>=0?1:-1;while(remaining>0){const next=idx+dir;if(next<0||next>=state.sentences.length)break;remaining-=sentenceSeconds(state.sentences[idx]);idx=next}sentenceIndex=idx;markSentence();speakCurrent()}
function repeatBlock(kind){let target=sentenceIndex;if(kind==='definition'){const found=state.meta.findIndex((m,i)=>m.type==='definition'&&i>=sentenceIndex);const any=state.meta.findIndex(m=>m.type==='definition');target=found>=0?found:any}else{const b=state.meta[sentenceIndex]?.block;target=state.meta.findIndex(m=>m.block===b)}if(target>=0){sentenceIndex=target;speakCurrent()}}
function page(delta){pageIndex=Math.max(0,Math.min(pages.length-1,pageIndex+delta));sentenceIndex=0;buildPage()}
$('play').onclick=()=>speechSynthesis.paused?speechSynthesis.resume():speakCurrent();$('pause').onclick=pauseResume;$('prevSentence').onclick=()=>jumpSentence(-1);$('nextSentence').onclick=()=>jumpSentence(1);$('back10').onclick=()=>jumpTime(-10);$('fwd10').onclick=()=>jumpTime(10);$('repeatBlock').onclick=()=>repeatBlock('block');$('repeatDefinition').onclick=()=>repeatBlock('definition');$('prevPage').onclick=()=>page(-1);$('nextPage').onclick=()=>page(1);$('speed').onchange=()=>{if(speechSynthesis.speaking)speakCurrent()};$('dysBtn').onclick=()=>document.body.classList.toggle('dyslexic');
function hold(id,fn){let timer,loop;const el=$(id);const start=e=>{e.preventDefault();timer=setTimeout(()=>{loop=setInterval(fn,230)},450)};const stop=()=>{clearTimeout(timer);clearInterval(loop)};el.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,stop))}
hold('back10',()=>jumpTime(-10));hold('fwd10',()=>jumpTime(10));
window.addEventListener('beforeunload',()=>speechSynthesis.cancel());buildPage();
</script>
</body>
</html>
