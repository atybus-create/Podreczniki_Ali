<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>Podręczniki Ali</title>
<style>
:root{--nav:#17324d;--ink:#18324a;--muted:#657687;--bg:#eef3f7;--paper:#fff;--accent:#2a78d1;--line:#d8e1e8;--read:#fff0a8;--word:#ffd451}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Verdana,sans-serif;background:var(--bg);color:var(--ink)}button,select,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:0 2px 10px #0002}
.brand{font-weight:800}.bookline{font-size:.88rem;opacity:.9}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top select{padding:8px;border-radius:10px;border:0;max-width:270px}
.btn{border:1px solid #bfd0df;background:#fff;border-radius:12px;padding:10px 13px;min-height:44px;cursor:pointer;font-weight:700;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{background:#fff8dc}.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{max-width:1500px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(320px,48%) 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #16324a12}
.pageCard{padding:12px}.pageHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pageNav{display:flex;align-items:center;gap:8px}.pageInput{width:74px;padding:9px;border:1px solid #bfd0df;border-radius:10px;text-align:center}.counter{background:#e9f1f8;border-radius:999px;padding:8px 11px;white-space:nowrap}
.pageStage{background:#e8edf1;border-radius:12px;min-height:650px;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:8px}.pageStage img{display:block;max-width:100%;height:auto;box-shadow:0 2px 10px #0002;background:#fff}
.reader{padding:16px;display:flex;flex-direction:column;min-height:720px}.reader h1{font-size:1.35rem;margin:0 0 5px}.sub{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.text{font-size:1.18rem;line-height:1.72;overflow:auto;max-height:55vh;padding-right:5px}.block{margin:0 0 13px;padding:8px 10px;border-radius:10px}.block:nth-child(2n){background:#f6f8fa}.sentence{padding:2px 3px;border-radius:6px;cursor:pointer}.sentence:hover{background:#edf5ff}.sentence.active{background:var(--read);box-shadow:0 0 0 2px #efd56c inset}.word.activeWord{background:var(--word);border-radius:4px;padding:0 1px}
.controls{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:9px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.speed{padding:9px;border:1px solid #bfd0df;border-radius:10px;background:#fff}.status{color:var(--muted);font-size:.9rem}.grow{flex:1}
.dyslexic .text{font-size:1.3rem;line-height:1.92;letter-spacing:.055em;word-spacing:.12em}.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:7px}.pageStage{min-height:480px}.reader{min-height:auto}.text{max-height:none}.controls{position:sticky;bottom:0;background:#fff;padding:9px 0 4px}.top{align-items:flex-start}.toolbar{justify-content:flex-end}.bookline{font-size:.76rem}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">📚 Podręczniki Ali</div><div class="bookline" id="bookLine">Ładowanie biblioteki…</div></div>
  <div class="toolbar"><select id="bookSelect" aria-label="Podręcznik"></select><button id="dysBtn" class="btn">Aa tryb dysleksji</button></div>
</header>
<main class="layout">
<section class="card pageCard">
  <div class="pageHead">
    <div><strong id="pageTitle">Strona</strong><div class="status" id="sourceInfo"></div></div>
    <div class="pageNav">
      <button class="btn" id="prevPage">←</button>
      <input class="pageInput" id="pageInput" type="number" min="1" value="1">
      <span class="counter" id="pageCounter">/ –</span>
      <button class="btn" id="nextPage">→</button>
    </div>
  </div>
  <div id="pageStage" class="pageStage"><div class="loading">Ładowanie strony…</div></div>
</section>
<section class="card reader">
  <h1 id="readerTitle">Tekst strony</h1>
  <div class="sub">Kliknij dowolne zdanie, aby zacząć czytać od tego miejsca.</div>
  <div class="text" id="text"><div class="loading">Ładowanie tekstu…</div></div>
  <div class="controls">
    <div class="row">
      <button class="btn" id="prevSentence">◀ zdanie</button>
      <button class="btn warn" id="back10">−10 s</button>
      <button class="btn primary" id="play">▶ Czytaj</button>
      <button class="btn" id="pause">⏸ Pauza</button>
      <button class="btn warn" id="fwd10">+10 s</button>
      <button class="btn" id="nextSentence">zdanie ▶</button>
    </div>
    <div class="row">
      <button class="btn" id="repeatBlock">↻ Powtórz akapit</button>
      <label>Tempo <select class="speed" id="speed"><option value=".7">0,7×</option><option value=".85">0,85×</option><option value="1" selected>1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option></select></label>
      <span class="status grow" id="status">Gotowe</span>
    </div>
    <div class="row">
      <label for="voiceSelect">Lektor</label>
      <select class="speed grow" id="voiceSelect" aria-label="Wybierz głos lektora"><option value="">Automatyczny (polski)</option></select>
      <button class="btn" id="voicePreview" type="button">🔊 Posłuchaj głosu</button>
      <span class="status" id="voiceInfo" aria-live="polite"></span>
    </div>
  </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const CONTENT_VERSION='166-20261111-mobile-speech-v4';
const apiPath=p=>'/api/file?pathname='+encodeURIComponent(p)+'&v='+CONTENT_VERSION;
let catalog=null,manifest=null,bookIndex=0,pageIndex=0,sentenceIndex=0,paused=false;
let speechRun=0;
let activeUtterance=null;
let speechStartTimer=null;
const VOICE_KEY="podreczniki-ali-pl-voice";
let selectedVoiceId="";
try{selectedVoiceId=localStorage.getItem(VOICE_KEY)||""}catch(_){}
let polishVoices=[];
const state={sentences:[],meta:[]};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function splitSentences(t){return (t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[t]).map(x=>x.trim()).filter(Boolean)}
async function json(path){const r=await fetch(apiPath(path),{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function init(){
  try{
    catalog=await json('books/catalog.json');
    $('bookSelect').innerHTML=catalog.books.map((b,i)=>`<option value="${i}">${esc(b.title)}</option>`).join('');
    $('bookSelect').onchange=()=>loadBook(+$('bookSelect').value);
    await loadBook(0);
  }catch(e){
    $('bookLine').textContent='Nie udało się załadować biblioteki';
    $('pageStage').innerHTML='<div class="loading">Brak zaimportowanego materiału. Spróbuj odświeżyć po zakończeniu wdrożenia.</div>';
    $('text').innerHTML='<div class="loading">'+esc(e.message)+'</div>';
  }
}
async function loadBook(i){
  stopSpeech();bookIndex=i;pageIndex=0;
  const b=catalog.books[i];
  manifest=await json(b.manifest);
  $('bookLine').textContent=`${b.title} · ${manifest.pageCount} stron`;
  $('pageInput').max=manifest.pageCount;
  await loadPage(0);
}
async function loadPage(i){
  if(!manifest)return;
  stopSpeech();paused=false;sentenceIndex=0;
  pageIndex=Math.max(0,Math.min(manifest.pages.length-1,i));
  const p=manifest.pages[pageIndex];
  $('pageInput').value=pageIndex+1;
  $('pageCounter').textContent=`/ ${manifest.pageCount}`;
  $('pageTitle').textContent=`Strona ${p.page}`;
  $('sourceInfo').textContent=`Pozycja ${pageIndex+1} z ${manifest.pageCount}`;
  $('pageStage').innerHTML=`<img alt="Strona ${p.page} podręcznika" src="${apiPath(`books/${manifest.id}/pages/${p.id}.jpg`)}">`;
  $('text').innerHTML='<div class="loading">Ładowanie tekstu…</div>';
  try{
    const data=await json(`books/${manifest.id}/text/${p.id}.json`);
    $('readerTitle').textContent=data.title||`Tekst strony ${p.page}`;
    renderText(data.paragraphs?.length?data.paragraphs:[data.text||'']);
  }catch(e){$('text').innerHTML='<div class="loading">Brak tekstu dla tej strony.</div>';state.sentences=[];state.meta=[]}
}
function renderText(paragraphs){
  state.sentences=[];state.meta=[];let html='';
  paragraphs.filter(Boolean).forEach((para,bi)=>{
    html+=`<div class="block" data-block="${bi}">`;
    splitSentences(para).forEach(s=>{
      const idx=state.sentences.length;state.sentences.push(s);state.meta.push({block:bi});
      const words=s.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:`<span class="word">${esc(w)}</span>`).join('');
      html+=`<span class="sentence" data-i="${idx}">${words}</span> `;
    });html+='</div>';
  });
  $('text').innerHTML=html||'<div class="loading">Na tej stronie nie ma tekstu do czytania.</div>';
  document.querySelectorAll('.sentence').forEach(el=>el.onclick=()=>{sentenceIndex=+el.dataset.i;speakCurrent()});
  markSentence();updateStatus('Gotowe');
}
function updateStatus(t){$('status').textContent=t}
function markSentence(){
  document.querySelectorAll('.sentence').forEach((e,i)=>e.classList.toggle('active',i===sentenceIndex));
  document.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));
  const el=document.querySelector(`.sentence[data-i="${sentenceIndex}"]`);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function markWord(charIndex){
  const sent=document.querySelector(`.sentence[data-i="${sentenceIndex}"]`);if(!sent)return;
  sent.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));
  let pos=0;for(const w of sent.querySelectorAll('.word')){const t=w.textContent;if(charIndex>=pos&&charIndex<=pos+t.length){w.classList.add('activeWord');break}pos+=t.length+1}
}
function stopSpeech(){
  speechRun++;
  if(speechStartTimer){clearTimeout(speechStartTimer);speechStartTimer=null}
  activeUtterance=null;
  try{if('speechSynthesis' in window && typeof speechSynthesis.cancel==='function')speechSynthesis.cancel()}catch(_){}
}
function voiceId(v){return v.voiceURI+"|"+v.name+"|"+v.lang}
function chosenVoice(){
  return polishVoices.find(v=>voiceId(v)===selectedVoiceId)
    ||polishVoices.find(v=>v.default)
    ||polishVoices[0]
    ||null;
}
function loadVoices(){
  if(!("speechSynthesis" in window)){$("voiceInfo").textContent="Przeglądarka nie obsługuje lektora";return}
  try{polishVoices=(typeof speechSynthesis.getVoices==="function"?speechSynthesis.getVoices():[]).filter(v=>/^pl(?:-|$)/i.test(v.lang))}catch(_){polishVoices=[]}
  const select=$("voiceSelect");
  select.innerHTML='<option value="">Automatyczny (polski)</option>';
  polishVoices.forEach(v=>{
    const option=document.createElement("option");
    option.value=voiceId(v);
    option.textContent=v.name+(v.localService?" (na urządzeniu)":"");
    select.appendChild(option);
  });
  select.value=polishVoices.some(v=>voiceId(v)===selectedVoiceId)?selectedVoiceId:"";
  $("voiceInfo").textContent=polishVoices.length
    ? "Dostępne polskie głosy: "+polishVoices.length
    : "Brak dodatkowych polskich głosów na tym urządzeniu";
}
function speakUtterance(message, readNext=false){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    updateStatus('Ten telefon lub przeglądarka nie obsługuje lektora.');
    return;
  }
  const run=speechRun;
  let u;
  try{
    u=new SpeechSynthesisUtterance(message);
    u.lang='pl-PL';
    u.rate=+$('speed').value;
    const voice=chosenVoice();
    if(voice)u.voice=voice;
    activeUtterance=u;
    let started=false;
    u.onstart=()=>{
      if(run!==speechRun)return;
      started=true;
      if(speechStartTimer){clearTimeout(speechStartTimer);speechStartTimer=null}
      updateStatus('Czytam zdanie '+(sentenceIndex+1)+' z '+state.sentences.length);
    };
    u.onboundary=e=>{if(run===speechRun&&e.name==='word')markWord(e.charIndex)};
    u.onend=()=>{
      if(run!==speechRun)return;
      if(speechStartTimer){clearTimeout(speechStartTimer);speechStartTimer=null}
      activeUtterance=null;
      document.querySelectorAll('.word').forEach(e=>e.classList.remove('activeWord'));
      if(readNext&&!paused&&sentenceIndex<state.sentences.length-1){
        sentenceIndex++;
        speakCurrent(true);
      }else updateStatus(readNext?'Koniec strony':'Odsłuch zakończony');
    };
    u.onerror=e=>{
      if(run!==speechRun)return;
      if(speechStartTimer){clearTimeout(speechStartTimer);speechStartTimer=null}
      activeUtterance=null;
      if(e.error==='interrupted'||e.error==='canceled')return;
      updateStatus('Błąd lektora: '+(e.error||'nieznany')+'. Spróbuj innego głosu lub przeglądarki.');
    };
    speechSynthesis.speak(u);
    speechStartTimer=setTimeout(()=>{
      if(run===speechRun&&!started){
        updateStatus('Telefon nie uruchomił lektora. Spróbuj wybrać głos polski i nacisnąć Czytaj ponownie.');
      }
    },4500);
  }catch(e){
    activeUtterance=null;
    updateStatus('Nie udało się uruchomić lektora: '+(e.message||'błąd przeglądarki'));
  }
}
function speakCurrent(continuation=false){
  if(!state.sentences.length){updateStatus('Brak tekstu do czytania');return}
  if(!continuation)stopSpeech();
  paused=false;
  markSentence();
  speakUtterance(state.sentences[sentenceIndex],true);
}
function jumpSentence(d){sentenceIndex=Math.max(0,Math.min(state.sentences.length-1,sentenceIndex+d));markSentence();speakCurrent()}
function sentenceSeconds(s){return Math.max(2,s.split(/\s+/).length/(2.6*+$('speed').value))}
function jumpTime(sec){if(!state.sentences.length)return;let idx=sentenceIndex,rem=Math.abs(sec),dir=sec>=0?1:-1;while(rem>0){const next=idx+dir;if(next<0||next>=state.sentences.length)break;rem-=sentenceSeconds(state.sentences[idx]);idx=next}sentenceIndex=idx;markSentence();speakCurrent()}
function repeatBlock(){if(!state.meta.length)return;const b=state.meta[sentenceIndex]?.block;const idx=state.meta.findIndex(m=>m.block===b);if(idx>=0){sentenceIndex=idx;speakCurrent()}}
$('prevPage').onclick=()=>loadPage(pageIndex-1);$('nextPage').onclick=()=>loadPage(pageIndex+1);
$('pageInput').onchange=()=>loadPage((+$('pageInput').value||1)-1);
$('play').onclick=()=>{if('speechSynthesis' in window && speechSynthesis.paused)speechSynthesis.resume();else speakCurrent()};
$('pause').onclick=()=>{if(!('speechSynthesis' in window))return;if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();paused=true;updateStatus('Pauza')}else if(speechSynthesis.paused){speechSynthesis.resume();paused=false;updateStatus('Czytam')}};
$('prevSentence').onclick=()=>jumpSentence(-1);$('nextSentence').onclick=()=>jumpSentence(1);$('back10').onclick=()=>jumpTime(-10);$('fwd10').onclick=()=>jumpTime(10);$('repeatBlock').onclick=repeatBlock;
$('speed').onchange=()=>{if('speechSynthesis' in window && speechSynthesis.speaking)speakCurrent()};
$('voiceSelect').onchange=()=>{
  selectedVoiceId=$('voiceSelect').value;
  try{if(selectedVoiceId)localStorage.setItem(VOICE_KEY,selectedVoiceId);else localStorage.removeItem(VOICE_KEY)}catch(_){}
  const wasSpeaking=('speechSynthesis' in window)&&speechSynthesis.speaking;
  stopSpeech();paused=false;
  if(wasSpeaking)speakCurrent();else updateStatus('Wybrano głos lektora');
};
$('voicePreview').onclick=()=>{
  stopSpeech();
  paused=false;
  updateStatus('Uruchamiam próbkę lektora…');
  speakUtterance('Witaj! Posłuchaj, jak czytam podręcznik do geografii. Odkrywajmy razem świat.',false);
};
// Inicjalizacja mowy nigdy nie może blokować odczytu podręcznika.
function initSpeech(){
  try{
    if(!('speechSynthesis' in window)){$('voiceInfo').textContent='Lektor niedostępny na tym urządzeniu';return}
    loadVoices();
    if(typeof speechSynthesis.addEventListener==='function')speechSynthesis.addEventListener('voiceschanged',loadVoices);
    else speechSynthesis.onvoiceschanged=loadVoices;
  }catch(_){$('voiceInfo').textContent='Nie udało się pobrać głosów, tekst pozostaje dostępny'}
}
$('dysBtn').onclick=()=>document.body.classList.toggle('dyslexic');
function hold(id,fn){let t,l;const e=$(id);const start=x=>{x.preventDefault();t=setTimeout(()=>l=setInterval(fn,260),450)};const stop=()=>{clearTimeout(t);clearInterval(l)};e.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(v=>e.addEventListener(v,stop))}
hold('back10',()=>jumpTime(-10));hold('fwd10',()=>jumpTime(10));
window.addEventListener('beforeunload',stopSpeech);
init();
initSpeech();
</script>
</body>
</html>
